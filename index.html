<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pose Reference Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pose-card { transition: transform 0.15s ease; }
    .pose-card:hover { transform: translateY(-3px); }
    .angle-btn { font-size: 10px; padding: 2px 6px; }
    .angle-btn.active { background: #0ea5e9; color: white; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-20 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-5">
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight">AI Pose Reference Gallery</h1>
      <p class="text-slate-400 mt-1 text-sm">1,439 images · 288 unique poses · Free for personal & commercial use</p>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
      <select id="filterSystem" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"><option value="">All Systems</option></select>
      <select id="filterClass" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"><option value="">All Classifications</option></select>
      <select id="filterAngle" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"><option value="">All Angles</option></select>
      <input id="search" type="search" placeholder="Search..." class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
    </div>
    <div id="stats" class="text-sm text-slate-400 mb-4"></div>
    <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    <div id="loading" class="text-center py-20 text-slate-400">Loading poses...</div>
    <div id="empty" class="hidden text-center py-20 text-slate-500">No poses match your filters.</div>
  </main>

  <div id="lightbox" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onclick="closeLightbox(event)">
    <div class="bg-slate-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-auto" onclick="event.stopPropagation()">
      <div class="p-4 border-b border-slate-800 flex justify-between">
        <div><h2 id="lbTitle" class="font-semibold"></h2><p id="lbMeta" class="text-sm text-slate-400"></p></div>
        <button onclick="closeLightbox()" class="text-2xl text-slate-400">&times;</button>
      </div>
      <div class="p-4 bg-slate-950 text-center"><img id="lbImage" class="max-h-[65vh] mx-auto" alt=""></div>
      <div class="p-4 border-t border-slate-800 flex justify-between text-sm">
        <a id="lbDownload" href="#" download class="text-sky-400">Download full PNG</a>
        <span id="lbId" class="text-slate-500 font-mono text-xs"></span>
      </div>
    </div>
  </div>

  <script>
    const systemMap = {"全身1人・セクシー系":"Full Body - Sexy","全身1人・標準系":"Full Body - Standard","上半身1人":"Upper Body","2人絡み":"Couple Poses"};
    const angleMap = {"正面":"Front","上から":"High Angle","下から":"Low Angle","横":"Side","斜め":"Diagonal"};
    const classMap = {"立ち":"Standing","座り":"Sitting","膝立ち・四つん這い":"Kneeling / On All Fours","寝そべり":"Lying Down","特殊":"Special","横座り・女の子座り":"Side Sitting","しゃがみ":"Squatting","前かがみ":"Bending Forward","のけぞり・反り":"Arching Back","ひねり":"Twisting","かわいい系":"Cute","胸寄せ・谷間強調系":"Chest Emphasis","セクシー・露骨寄り系":"Sexy / Explicit","立位":"Standing","顔寄せ系":"Face Close","正常位":"Missionary","後背位":"Doggy Style","座位":"Sitting","背面座位":"Reverse Sitting","騎乗位":"Cowgirl","側位":"Side Position","対面座位":"Face-to-Face Sitting","立位密着":"Standing Close","座位密着":"Sitting Close","密着":"Close Contact"};

    let poseGroups = [];
    let filteredGroups = [];

    async function init() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/anhao/ai-pose-gallery-zh/main/data/pose.json');
        const raw = await res.json();
        const groups = {};
        raw.forEach(item => {
          const key = item["系統"] + "|" + item["ポーズ番号"];
          if (!groups[key]) {
            groups[key] = {
              system: systemMap[item["系統"]] || item["系統"],
              pose_number: item["ポーズ番号"],
              classification: classMap[item["分類"]] || item["分類"],
              pose_name: item["ポーズ名"],
              angles: {}
            };
          }
          const ang = angleMap[item["アングル"]] || item["アングル"];
          groups[key].angles[ang] = {
            thumbnail: 'https://raw.githubusercontent.com/anhao/ai-pose-gallery-zh/main/' + item["サムネ"],
            fullsize: 'https://raw.githubusercontent.com/anhao/ai-pose-gallery-zh/main/' + item["原寸"],
            id: item.id
          };
        });
        poseGroups = Object.values(groups);
        populateFilters();
        applyFilters();
      } catch (e) {
        console.error(e);
        document.getElementById('loading').textContent = 'Failed to load data.';
      }
      document.getElementById('loading').classList.add('hidden');
    }

    function populateFilters() {
      const systems = [...new Set(poseGroups.map(g => g.system))].sort();
      const classes = [...new Set(poseGroups.map(g => g.classification))].sort();
      const angles = [...new Set(poseGroups.flatMap(g => Object.keys(g.angles)))].sort();
      systems.forEach(s => document.getElementById('filterSystem').add(new Option(s, s)));
      classes.forEach(c => document.getElementById('filterClass').add(new Option(c, c)));
      angles.forEach(a => document.getElementById('filterAngle').add(new Option(a, a)));
    }

    function applyFilters() {
      const system = document.getElementById('filterSystem').value;
      const cls = document.getElementById('filterClass').value;
      const angle = document.getElementById('filterAngle').value;
      const q = document.getElementById('search').value.toLowerCase().trim();
      filteredGroups = poseGroups.filter(g => {
        if (system && g.system !== system) return false;
        if (cls && g.classification !== cls) return false;
        if (angle && !g.angles[angle]) return false;
        if (q && !g.pose_name.toLowerCase().includes(q) && !g.pose_number.toLowerCase().includes(q)) return false;
        return true;
      });
      renderGallery();
      document.getElementById('stats').textContent = `Showing ${filteredGroups.length} unique poses`;
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      if (!filteredGroups.length) {
        document.getElementById('empty').classList.remove('hidden');
        return;
      }
      document.getElementById('empty').classList.add('hidden');
      filteredGroups.forEach(g => {
        const defaultAng = g.angles['Front'] ? 'Front' : Object.keys(g.angles)[0];
        const card = document.createElement('div');
        card.className = 'pose-card bg-slate-900 rounded-xl overflow-hidden border border-slate-800';
        card.innerHTML = `
          <div class="aspect-[3/4] bg-slate-950 cursor-pointer" onclick="openLightbox(this)">
            <img src="${g.angles[defaultAng].thumbnail}" data-full="${g.angles[defaultAng].fullsize}" data-id="${g.angles[defaultAng].id}" class="w-full h-full object-cover" loading="lazy">
          </div>
          <div class="p-2">
            <div class="text-xs font-medium truncate">${g.pose_name}</div>
            <div class="text-[11px] text-slate-500 mb-1">${g.pose_number} · ${g.classification}</div>
            <div class="flex flex-wrap gap-1">${Object.keys(g.angles).map(a => `<button class="angle-btn bg-slate-800 rounded ${a===defaultAng?'active':''}" onclick="switchAngle(this,'${a}')">${a}</button>`).join('')}</div>
          </div>
        `;
        card.dataset.group = JSON.stringify(g);
        gallery.appendChild(card);
      });
    }

    function switchAngle(btn, ang) {
      const card = btn.closest('.pose-card');
      const g = JSON.parse(card.dataset.group);
      const img = card.querySelector('img');
      img.src = g.angles[ang].thumbnail;
      img.dataset.full = g.angles[ang].fullsize;
      img.dataset.id = g.angles[ang].id;
      card.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      event.stopPropagation();
    }

    function openLightbox(el) {
      const img = el.querySelector('img');
      const card = el.closest('.pose-card');
      const g = JSON.parse(card.dataset.group);
      document.getElementById('lbTitle').textContent = g.pose_name;
      document.getElementById('lbMeta').textContent = `${g.system} · ${g.classification}`;
      document.getElementById('lbImage').src = img.dataset.full;
      document.getElementById('lbDownload').href = img.dataset.full;
      document.getElementById('lbId').textContent = img.dataset.id;
      document.getElementById('lightbox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(e) {
      if (e && e.target.id !== 'lightbox' && e.target.tagName !== 'BUTTON') return;
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = '';
    }

    document.getElementById('filterSystem').onchange = applyFilters;
    document.getElementById('filterClass').onchange = applyFilters;
    document.getElementById('filterAngle').onchange = applyFilters;
    document.getElementById('search').oninput = applyFilters;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    init();
  </script>
</body>
</html>
